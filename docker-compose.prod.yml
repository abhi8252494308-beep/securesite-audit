version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: securesite-db-prod
    environment:
      POSTGRES_DB: securesite_audit
      POSTGRES_USER: securesite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securesite -d securesite_audit"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securesite-network

  mongodb:
    image: mongo:7
    container_name: securesite-mongodb-prod
    environment:
      MONGO_INITDB_DATABASE: securesite_audit
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securesite-network

  redis:
    image: redis:7-alpine
    container_name: securesite-redis-prod
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securesite-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securesite-backend-prod
    environment:
      DATABASE_URL: postgresql+asyncpg://securesite:${POSTGRES_PASSWORD}@db:5432/securesite_audit
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: securesite_audit
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      API_V1_PREFIX: /api/v1
      REDIS_URL: redis://redis:6379/0
      APP_NAME: "SecureSite Audit"
      APP_URL: ${APP_URL}
      DEBUG: "False"
      AUDIT_TIMEOUT_SECONDS: 120
      MAX_CONCURRENT_AUDITS: 5
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - securesite-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securesite-frontend-prod
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - securesite-network
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  securesite-network:
    driver: bridge